name: collect-2x-daily
on:
  schedule:
    - cron: "20 11,23 * * *"   # 19:20 / 07:20 SGT
  workflow_dispatch:

concurrency:
  group: ledgers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run collectors under health ledger
        run: WATCH_MIN=8 python run_with_health.py collect_daily.py arb_census.py arb_watch.py kalshi_xvenue.py limitless_xvenue.py sx_bet.py funding_carry.py relations_watch.py
      - name: commit ledgers
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0 || sleep $((RANDOM % 8 + 2))
          done
          exit 1
