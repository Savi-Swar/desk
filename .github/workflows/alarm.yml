name: failure-alarm
on:
  workflow_run:
    workflows: ["sims-30min", "collect-2x-daily", "book-recorder"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  check:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: open issue after two consecutive failures
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.payload.workflow_run;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: wf.workflow_id, per_page: 2, status: "completed",
            });
            const twoFails = runs.data.workflow_runs.length >= 2 &&
              runs.data.workflow_runs.every(r => r.conclusion === "failure");
            if (!twoFails) return;
            const title = `ALARM: ${wf.name} failing`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "alarm",
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ["alarm"],
              body: `Two consecutive failures of **${wf.name}**.\n\nLatest run: ${wf.html_url}\n\nAuto-opened by failure-alarm; close after fixing.`,
            });
