name: book-recorder
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: record books and calibrate fills
        run: |
          python firehose_recorder.py &
          python book_recorder.py &
          wait
          python trade_markout.py
          python maker_pnl_real.py   # trustworthy maker P&L from real fills
      - name: commit the calibration (the markout gate data)
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.ours.driver true   # lets .gitattributes merge=ours resolve derived-file races
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fill calibration $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            # maker_pnl_real.csv is fully rewritten every run, so an overlapping run
            # conflicts on it deterministically and plain retrying can never win.
            # It is pure derived state, so recompute it from the (append-only, cleanly
            # merged) ledger and continue the rebase.
            if [ "$(git diff --name-only --diff-filter=U)" = "collected/maker_pnl_real.csv" ]; then
              git checkout --ours collected/maker_pnl_real.csv
              python maker_pnl_real.py
              git add collected/maker_pnl_real.csv
              if GIT_EDITOR=true git rebase --continue && git push origin main; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true   # never leave a wedged rebase for the next retry
            sleep $((RANDOM % 8 + 2))
          done
          exit 1
      - name: upload raw recording (for millisecond replay later)
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ github.run_id }}
          path: |
            collected/books/
            collected/trades/
          retention-days: 30
          if-no-files-found: warn
