name: book-recorder
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: recorder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: record books and calibrate fills
        run: python book_recorder.py && python fill_model.py
      - name: upload recording
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ github.run_id }}
          path: collected/books/
          retention-days: 30
          if-no-files-found: warn
