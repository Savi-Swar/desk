name: book-recorder
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ledgers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: record books and calibrate fills
        run: python book_recorder.py && python fill_model.py
      - name: commit the calibration (the markout gate data)
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add collected/fill_model.csv collected/health.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "fill calibration $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
      - name: upload raw recording (for millisecond replay later)
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ github.run_id }}
          path: collected/books/
          retention-days: 30
          if-no-files-found: warn
