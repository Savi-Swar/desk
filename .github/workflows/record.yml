name: book-recorder
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: ledgers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: record books and calibrate fills
        run: python firehose_recorder.py & python book_recorder.py && python trade_markout.py && wait
      - name: commit the calibration (the markout gate data)
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fill calibration $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0 || sleep $((RANDOM % 8 + 2))
          done
          exit 1
      - name: upload raw recording (for millisecond replay later)
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ github.run_id }}
          path: |
            collected/books/
            collected/trades/
          retention-days: 30
          if-no-files-found: warn
