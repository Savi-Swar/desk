name: sims-30min
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ledgers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run sims under health ledger
        run: python run_with_health.py single_cond_watch.py maker_sim.py maker_sim2.py maker_sim3.py maker_arb_sim.py
      - name: commit ledgers
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add collected/
          git diff --cached --quiet && exit 0
          git commit -m "sims $(date -u +%Y-%m-%dT%H:%MZ)"
          # Overlapping runs race on the same append-only ledgers. .gitattributes
          # merges them by union; retry covers a push that loses the race anyway.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
