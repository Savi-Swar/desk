name: sims-30min
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run sims under health ledger
        run: WATCH_MIN=3 WS_MIN=22 python run_with_health.py single_cond_watch.py ws_detect.py maker_sim.py maker_sim2.py maker_sim3.py maker_arb_sim.py
      - name: commit ledgers
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "sims $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true   # never leave a wedged rebase for the next retry
            sleep $((RANDOM % 8 + 2))
          done
          exit 1
